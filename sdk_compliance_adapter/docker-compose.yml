services:
  # PostHog Go SDK adapter
  sdk-adapter:
    build:
      context: ..
      dockerfile: sdk_compliance_adapter/Dockerfile
    environment:
      # Codec that /init's enable_compression turns on: gzip, deflate, br or zstd.
      - COMPRESSION=${COMPRESSION:-gzip}
    expose:
      - "8080"
    networks:
      - test-network

  # Test harness
  test-harness:
    image: ghcr.io/posthog/sdk-test-harness:1.13.1
    command: ["run", "--adapter-url", "http://sdk-adapter:8080", "--mock-url", "http://test-harness:8081"]
    networks:
      - test-network
    depends_on:
      - sdk-adapter

networks:
  test-network:
    driver: bridge
