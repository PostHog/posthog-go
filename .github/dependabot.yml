version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/otel"
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # OpenTelemetry v1.47.0 requires Go 1.26, and the otel module supports Go 1.25.
    # Remove this when the otel module's minimum Go version is raised.
    ignore:
      - dependency-name: "go.opentelemetry.io/otel*"
        versions: [">= 1.47.0"]
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      release-tooling:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
