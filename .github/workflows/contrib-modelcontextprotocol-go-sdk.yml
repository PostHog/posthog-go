name: MCP Go SDK Adapter

on:
  pull_request:
    paths:
      - '.github/workflows/contrib-modelcontextprotocol-go-sdk.yml'
      - 'contrib/modelcontextprotocol/go-sdk/**'
      - 'mcp/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/contrib-modelcontextprotocol-go-sdk.yml'
      - 'contrib/modelcontextprotocol/go-sdk/**'
      - 'mcp/**'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ADAPTER_DIR: contrib/modelcontextprotocol/go-sdk

jobs:
  build:
    name: Build (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', '1.x']
    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Create local workspace
        run: go work init . ./${ADAPTER_DIR}
      - name: Build
        working-directory: ${{ env.ADAPTER_DIR }}
        run: go build ./...

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', '1.x']
    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Create local workspace
        run: go work init . ./${ADAPTER_DIR}
      - name: Test
        working-directory: ${{ env.ADAPTER_DIR }}
        run: go test -count=1 -timeout=5m ./...

  race:
    name: Race tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', '1.x']
    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Create local workspace
        run: go work init . ./${ADAPTER_DIR}
      - name: Race tests
        working-directory: ${{ env.ADAPTER_DIR }}
        run: go test -race -count=1 -timeout=5m ./...

  vet:
    name: Go vet (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', '1.x']
    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Create local workspace
        run: go work init . ./${ADAPTER_DIR}
      - name: Vet
        working-directory: ${{ env.ADAPTER_DIR }}
        run: go vet ./...
